[package]
name = "tpt-media-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["pcm", "wav", "media-io", "streaming", "no-std"]
categories = ["multimedia::audio", "multimedia::images", "filesystem", "no-std"]
readme = "README.md"
description = "PCM/WAV/raw audio and image frame I/O plus streaming sources/sinks for the tpt-media stack (reuses tpt-dsp-io for WAV/DSP)."

[dependencies]
tpt-media-core = { workspace = true, default-features = false }
tpt-dsp-io = { workspace = true, optional = true }
# `no_std` float methods (`f32::round`, `f64::sin`) are std-only. The
# workspace convention is to call them through `libm` explicitly, as
# `tpt-media-core` and `codecs/reed` already do — inherent methods are
# ambiguous under `no_std` and resolve to the std ones when `std` is on.
libm = "0.2"

[features]
default = ["std"]
std = ["dep:tpt-dsp-io", "tpt-media-core/std"]