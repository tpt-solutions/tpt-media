[package]
name = "tpt-media-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "PCM/WAV/raw audio and image frame I/O plus streaming sources/sinks for the tpt-media stack (reuses tpt-dsp-io for WAV/DSP)."

[dependencies]
tpt-media-core = { workspace = true, features = ["std"] }
tpt-dsp-io = { workspace = true, optional = true }

[features]
default = ["std"]
std = ["dep:tpt-dsp-io", "tpt-media-core/std"]