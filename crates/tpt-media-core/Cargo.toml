[package]
name = "tpt-media-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Shared media data types for the tpt-media stack (timestamps, packets, frames, tracks, metadata)."

[dependencies]
tpt-media-bitstream = { workspace = true, default-features = false }
thiserror = { workspace = true }
bitflags = { workspace = true }
libm = "0.2"

[features]
default = ["std"]
std = ["tpt-media-bitstream/std", "thiserror/std", "bitflags/std"]

[lib]
path = "src/lib.rs"