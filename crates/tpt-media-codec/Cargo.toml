[package]
name = "tpt-media-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["codec", "encoder", "decoder", "capabilities", "resource-limits"]
categories = ["encoding", "multimedia", "no-std"]
readme = "README.md"
description = "Generic codec framework: Encoder, Decoder, Codec traits, capabilities, resource limits."

[dependencies]
tpt-media-core = { workspace = true, default-features = false }
tpt-media-bitstream = { workspace = true, default-features = false }
thiserror = { workspace = true }
bitflags = { workspace = true }

[features]
default = ["std"]
std = ["tpt-media-core/std", "tpt-media-bitstream/std", "thiserror/std"]