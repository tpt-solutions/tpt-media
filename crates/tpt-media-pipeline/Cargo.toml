[package]
name = "tpt-media-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Node-based media pipeline (Source -> Demux -> Decode -> Filter -> Encode -> Mux -> Sink)."

[dependencies]
tpt-media-core = { workspace = true, features = ["std"] }
tpt-media-codec = { workspace = true, features = ["std"] }
tpt-media-container = { workspace = true, features = ["std"] }

[dev-dependencies]
criterion = "0.8"
tpt-container = { workspace = true }

[features]
default = ["std"]
std = ["tpt-media-core/std", "tpt-media-codec/std", "tpt-media-container/std"]
[[bench]]
name = "pipeline_bench"
harness = false
