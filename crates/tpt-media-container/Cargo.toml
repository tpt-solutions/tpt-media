[package]
name = "tpt-media-container"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["container", "demuxer", "muxer", "chunk", "no-std"]
categories = ["encoding", "parser-implementations", "no-std"]
readme = "README.md"
description = "Generic container abstraction (Demuxer/Muxer traits)."

[dependencies]
tpt-media-core = { workspace = true, default-features = false }
tpt-media-bitstream = { workspace = true, default-features = false }
thiserror = { workspace = true }

[features]
default = ["std"]
std = ["tpt-media-core/std", "tpt-media-bitstream/std", "thiserror/std"]
