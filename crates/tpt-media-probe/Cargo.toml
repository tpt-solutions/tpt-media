[package]
name = "tpt-media-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["media-probe", "introspection", "metadata", "container", "no-std"]
categories = ["multimedia", "parser-implementations", "no-std"]
readme = "README.md"
description = "Container and codec introspection for the tpt-media stack."

[dependencies]
tpt-media-core = { workspace = true, default-features = false }
tpt-media-codec = { workspace = true, default-features = false }
tpt-media-container = { workspace = true, default-features = false }
tpt-container = { workspace = true, default-features = false }

[features]
default = ["std"]
std = ["tpt-media-core/std", "tpt-media-codec/std", "tpt-media-container/std", "tpt-container/std"]