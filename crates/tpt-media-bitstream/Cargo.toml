[package]
name = "tpt-media-bitstream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["bitstream", "entropy-coding", "huffman", "rice-coding", "range-coder"]
categories = ["encoding", "algorithms", "no-std"]
readme = "README.md"
description = "Zero-allocation bit reader/writer and entropy coding for tpt-media."

[dependencies]
thiserror = { workspace = true }
libm = "0.2"

[features]
default = ["std"]
std = ["thiserror/std"]
[[bench]]
name = "bitstream_bench"
harness = false

[dev-dependencies]
criterion = "0.8"
