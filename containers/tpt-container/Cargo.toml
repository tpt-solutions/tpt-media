[package]
name = "tpt-container"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["container-format", "tpt", "muxing", "demuxing", "streaming"]
categories = ["encoding", "parser-implementations", "multimedia", "filesystem"]
readme = "README.md"
description = "The native .tpt container format: TLV chunks, header, TRAK, CLUS, seeking, streaming."

[dependencies]
tpt-media-core = { workspace = true, default-features = false }
tpt-media-bitstream = { workspace = true, default-features = false }
tpt-media-codec = { workspace = true, default-features = false }
tpt-media-container = { workspace = true, default-features = false }
thiserror = { workspace = true }

[features]
default = ["std"]
std = ["tpt-media-core/std", "tpt-media-bitstream/std", "tpt-media-codec/std", "tpt-media-container/std"]
[[bench]]
name = "container_bench"
harness = false

[dev-dependencies]
criterion = "0.8"
