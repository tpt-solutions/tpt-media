[package]
name = "tpt-media-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Stable C ABI for the tpt-media codec abstraction: opaque handles, explicit ownership, error codes."
keywords = ["ffi", "c-api", "codec", "bindings", "abi"]
categories = ["external-ffi-bindings", "api-bindings", "encoding"]
readme = "README.md"


[lib]
# `rlib` so the Rust-side tests (and any future Rust wrapper) can depend
# on the crate; `staticlib` so a C application can link the archive
# produced by `cargo build -p tpt-media-sys`.
crate-type = ["rlib", "staticlib"]

[dependencies]
# `version` is required on every path dependency for `cargo package` /
# `cargo publish` (a packaged crate cannot carry a bare `path`), and is
# the workspace version like every other member (CONTRIBUTING §9.1).
tpt-media-core = { path = "../../crates/tpt-media-core", version = "0.1.0" }
tpt-media-codec = { path = "../../crates/tpt-media-codec", version = "0.1.0" }
tpt-audio-cinder = { path = "../../codecs/cinder", version = "0.1.0" }
tpt-audio-aura = { path = "../../codecs/aura", version = "0.1.0" }
tpt-audio-reed = { path = "../../codecs/reed", version = "0.1.0" }

[build-dependencies]
cc = "1"
