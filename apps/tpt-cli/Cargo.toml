[package]
name = "tpt-media-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["cli", "media-tool", "transcoder", "probe", "tpt"]
categories = ["command-line-utilities", "multimedia::audio", "encoding"]
readme = "README.md"
description = "TPT media command-line interface (probe, encode, decode, transcode, inspect, benchmark)."

[[bin]]
name = "tpt"
path = "src/main.rs"

[dependencies]
tpt-media-core = { workspace = true, features = ["std"] }
tpt-media-codec = { workspace = true, features = ["std"] }
tpt-media-container = { workspace = true, features = ["std"] }
tpt-media-io = { workspace = true, features = ["std"] }
tpt-media-probe = { workspace = true, features = ["std"] }
tpt-media-format = { workspace = true, features = ["std"] }
tpt-media-cinder = { workspace = true, features = ["std"] }
tpt-media-aura = { workspace = true, features = ["std"] }
tpt-media-reed = { workspace = true, features = ["std"] }
tpt-media-thrum = { workspace = true, features = ["std"] }
tpt-media-vault = { workspace = true, features = ["std"] }
tpt-media-mote = { workspace = true, features = ["std"] }
tpt-dsp-core = { workspace = true, features = ["std"] }