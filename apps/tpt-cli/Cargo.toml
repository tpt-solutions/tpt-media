[package]
name = "tpt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "TPT media command-line interface (probe, encode, decode, transcode, inspect, benchmark)."

[[bin]]
name = "tpt"
path = "src/main.rs"

[dependencies]
tpt-media-core = { workspace = true, features = ["std"] }
tpt-media-codec = { workspace = true, features = ["std"] }
tpt-media-container = { workspace = true, features = ["std"] }
tpt-media-io = { workspace = true, features = ["std"] }
tpt-media-probe = { workspace = true, features = ["std"] }
tpt-container = { workspace = true, features = ["std"] }
tpt-audio-pulse = { workspace = true, features = ["std"] }
tpt-audio-aura = { workspace = true, features = ["std"] }
tpt-audio-vox = { workspace = true, features = ["std"] }
tpt-dsp-core = { workspace = true, features = ["std"] }