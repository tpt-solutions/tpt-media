name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

  msrv:
    name: MSRV (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kept in lockstep with `rust-version` in [workspace.package]; see
      # CONTRIBUTING.md §9.3 for the bump policy.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check on MSRV
        run: cargo check --workspace --locked --all-targets

  no_std:
    name: no_std build (tpt-audio-reed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - name: cargo build no_std reed
        run: cargo build -p tpt-audio-reed --target thumbv7em-none-eabi --no-default-features

  wasm:
    name: wasm32 build (foundation crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # §1's "WASM-compatible core components", enforced: the six
      # no_std foundation crates must keep compiling for wasm32 with
      # std off (todo.md §45's decoder sits on exactly these).
      - name: cargo check foundation crates for wasm32
        run: cargo check -p tpt-media-core -p tpt-media-bitstream -p tpt-media-codec -p tpt-media-pipeline -p tpt-media-io -p tpt-media-probe --target wasm32-unknown-unknown --no-default-features --locked