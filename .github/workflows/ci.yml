name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

  metadata:
    name: crate metadata (README/CHANGELOG/keywords/categories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CONTRIBUTING.md §9.4: every member ships its own README.md and
      # CHANGELOG.md, declares at most five keywords, uses only valid
      # crates.io categories, and does not duplicate another crate's
      # keyword set. The same script resolves every relative markdown
      # link in the repo, because a broken cross-reference between a
      # crate README and a design document is invisible until clicked.
      - name: check crate metadata
        run: python ci/check-metadata.py

  msrv:
    name: MSRV (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kept in lockstep with `rust-version` in [workspace.package]; see
      # CONTRIBUTING.md §9.3 for the bump policy.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check on MSRV
        run: cargo check --workspace --locked --all-targets

  no_std:
    name: no_std build (tpt-audio-reed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - name: cargo build no_std reed
        run: cargo build -p tpt-audio-reed --target thumbv7em-none-eabi --no-default-features

  wasm:
    name: wasm32 build (foundation crates + tpt-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # §1's "WASM-compatible core components", enforced: the six
      # no_std foundation crates must keep compiling for wasm32 with
      # std off (todo.md §45's decoder sits on exactly these).
      - name: cargo check foundation crates for wasm32
        run: cargo check -p tpt-media-core -p tpt-media-bitstream -p tpt-media-codec -p tpt-media-pipeline -p tpt-media-io -p tpt-media-probe -p tpt-media-container --target wasm32-unknown-unknown --no-default-features --locked
      # todo.md §45: the player itself as a real wasm module (cdylib), then the
      # Node smoke tests against that binary. Node exercises the wasm and the JS
      # glue; it is not a browser, so this step alone covers neither audible
      # output nor canvas drawing. The step after it does, to the extent a
      # runner without a sound card allows.
      - name: build tpt-web for wasm32
        run: node apps/tpt-web/web/build.mjs
      - name: tpt-web wasm smoke tests (Node)
        run: node apps/tpt-web/web/check.mjs && node apps/tpt-web/web/mock-browser.mjs
      # todo.md §45: the real browser APIs, on the runner's preinstalled
      # Chrome. This is not a claim that anyone heard the audio - a CI runner
      # has no audio output device, so the page reports its playback-dependent
      # checks as SKIP ("not verifiable here") and this step verifies only what
      # it can: the page and the wasm load in a real engine, the canvas is
      # real, and nothing regresses to FAIL. Locally, on a machine with a
      # sound card, all 29 checks run (web/browser-check.mjs).
      - name: tpt-web real-browser check (headless Chrome)
        run: node apps/tpt-web/web/browser-check.mjs

  aarch64:
    name: AArch64 cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # todo.md §40: prove every Rust crate builds for a second
      # architecture. `cargo check` needs no linker/sysroot, so this
      # runs on a stock runner; tpt-media-sys is excluded because its
      # build script compiles the C integration test with a
      # target-unknown compiler. Test *execution* on AArch64 (QEMU)
      # and cross-target-feature builds remain the open part of this
      # item.
      - name: cargo check (aarch64)
        run: cargo check --workspace --exclude tpt-media-sys --locked --target aarch64-unknown-linux-gnu
