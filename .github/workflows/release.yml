name: Release CLI

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: tpt-linux-x86_64
          - target: x86_64-apple-darwin
            artifact: tpt-macos-x86_64
          - target: aarch64-apple-darwin
            artifact: tpt-macos-aarch64
          - target: x86_64-pc-windows-msvc
            artifact: tpt-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p tpt-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p out
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/tpt.exe out/${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/tpt out/${{ matrix.artifact }}
          fi
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tpt-linux-x86_64
            tpt-macos-x86_64
            tpt-macos-aarch64
            tpt-windows-x86_64.exe