name: Clone sibling tpt-dsp
description: >
  The root Cargo.toml resolves tpt-dsp-core and tpt-dsp-io from
  ../tpt-dsp (a sibling checkout, not a git dependency). Clone that public
  repository next to the workspace so cargo can load the manifests. Run it
  after actions/checkout in any job that invokes cargo.

runs:
  using: composite
  steps:
    - name: Clone tpt-dsp next to the workspace
      shell: bash
      run: |
        set -euo pipefail
        dest="$(dirname "$GITHUB_WORKSPACE")/tpt-dsp"
        if [ ! -f "$dest/tpt-dsp-core/Cargo.toml" ]; then
          git clone --depth 1 https://github.com/tpt-solutions/tpt-dsp.git "$dest"
        fi
