[package]
name = "tpt-audio-pulse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Pulse: TPT native real-time low-latency audio codec (MDCT + scalar quantisation + PLC)."

[dependencies]
tpt-media-core = { workspace = true, features = ["std"] }
tpt-media-bitstream = { workspace = true, features = ["std"] }
tpt-media-codec = { workspace = true, features = ["std"] }
tpt-dsp-core = { workspace = true, features = ["std"] }
thiserror = { workspace = true }

[features]
default = ["std"]
std = ["tpt-media-core/std", "tpt-media-bitstream/std", "tpt-media-codec/std"]
[[bench]]
name = "codec_bench"
harness = false

[dev-dependencies]
criterion = "0.8"
