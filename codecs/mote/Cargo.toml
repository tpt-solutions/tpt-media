[package]
name = "tpt-video-mote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["video-codec", "vector-quantization", "iot", "edge", "low-bitrate"]
categories = ["multimedia::video", "encoding", "compression", "no-std"]
readme = "README.md"
description = "Mote: TPT extreme edge/IoT video codec (8x8 patch dictionary VQ, 4096 entries, 12-bit index, temporal skip)."

[dependencies]
tpt-media-core = { workspace = true, features = ["std"] }
tpt-media-bitstream = { workspace = true, features = ["std"] }
tpt-media-codec = { workspace = true, features = ["std"] }
tpt-dsp-core = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = ["tpt-media-core/std", "tpt-media-bitstream/std", "tpt-media-codec/std", "tpt-dsp-core/std"]

[[bench]]
name = "codec_bench"
harness = false

[dev-dependencies]
criterion = "0.8"
