[package]
name = "tpt-audio-aura"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["audio-codec", "lossless", "mdct", "psychoacoustics", "archival"]
categories = ["multimedia::audio", "encoding", "compression"]
readme = "README.md"
description = "Aura: TPT high-fidelity / archival audio codec (lossless LPC + lossy MDCT)."

[dependencies]
tpt-media-core = { workspace = true, features = ["std"] }
tpt-media-bitstream = { workspace = true, features = ["std"] }
tpt-media-codec = { workspace = true, features = ["std"] }
tpt-dsp-core = { workspace = true, features = ["std"] }
thiserror = { workspace = true }

[features]
default = ["std"]
std = ["tpt-media-core/std", "tpt-media-bitstream/std", "tpt-media-codec/std"]
lossless = []
lossy = []
[[bench]]
name = "codec_bench"
harness = false

[dev-dependencies]
criterion = "0.8"
